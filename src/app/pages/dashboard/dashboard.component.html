<section class="dashboard-container">
  <div class="dashboard-content">
    <h2>Dashboard</h2>
    <div class="button-group">
      <button mat-stroked-button color="primary">Transferir</button>
      <button mat-stroked-button color="primary">Depositar</button>
      <button mat-stroked-button color="primary">Investir</button>
    </div>
  </div>

  <mat-card class="card-statement">
    <mat-card-title>Últimas transações</mat-card-title>
    <div class="statement-content">
      <table
        mat-table
        [dataSource]="latestTransactions"
        class="mat-elevation-z1"
      >
        <ng-container matColumnDef="type">
          <th mat-header-cell *matHeaderCellDef>Aplicação</th>
          <td mat-cell *matCellDef="let element">{{ element.description }}</td>
        </ng-container>

        <ng-container matColumnDef="date">
          <th mat-header-cell *matHeaderCellDef>Data</th>
          <td mat-cell *matCellDef="let element">
            {{ element.date | date : "dd/MM/yyyy" }}
          </td>
        </ng-container>

        <ng-container matColumnDef="value">
          <th mat-header-cell *matHeaderCellDef>Valor</th>
          <td
            mat-cell
            *matCellDef="let element"
            class="value"
            [ngClass]="{
              positive: element.value > 0,
              negative: element.value < 0
            }"
          >
            {{ element.value | currency : "BRL" : "symbol" }}
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="['type', 'date', 'value']"></tr>
        <tr
          mat-row
          *matRowDef="let row; columns: ['type', 'date', 'value']"
        ></tr>
      </table>

      <ngx-charts-line-chart
        [view]="view"
        [scheme]="'vivid'"
        [results]="chartData"
        [xAxis]="true"
        [yAxis]="true"
        [legend]="false"
        [showXAxisLabel]="true"
        [showYAxisLabel]="true"
        [xAxisLabel]="'Data'"
        [yAxisLabel]="'Valor (R$)'"
        [autoScale]="true"
      >
      </ngx-charts-line-chart>
    </div>
  </mat-card>
</section>
