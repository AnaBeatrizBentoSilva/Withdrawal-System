<section class="dashboard-container">
  <div class="dashboard-content">
    <h2>Dashboard</h2>
    <div class="button-group">
      <button mat-stroked-button color="primary" routerLink="/transfer">Transferir</button>
      <button mat-stroked-button color="primary" routerLink="/transfer">Depositar</button>
      <button mat-stroked-button color="primary" routerLink="/transfer">Sacar</button>
    </div>
  </div>
  <div class="dashboard-container-summary">
    <mat-card class="card-statement">
      <mat-card-title>Últimas transações</mat-card-title>
      <table
        mat-table
        [dataSource]="latestTransactions"
        class="mat-elevation-z1"
      >
        <ng-container matColumnDef="type">
          <th mat-header-cell *matHeaderCellDef>Descrição</th>
          <td mat-cell *matCellDef="let element">{{ element.description }}</td>
        </ng-container>

        <ng-container matColumnDef="date">
          <th mat-header-cell *matHeaderCellDef>Data</th>
          <td mat-cell *matCellDef="let element">
            {{ element.date | date : "dd/MM/yyyy" }}
          </td>
        </ng-container>

        <ng-container matColumnDef="value">
          <th mat-header-cell *matHeaderCellDef>Valor</th>
          <td
            mat-cell
            *matCellDef="let element"
            class="value"
            [ngClass]="{
              positive: element.value > 0,
              negative: element.value < 0
            }"
          >
            {{ element.value | currency : "BRL" : "symbol" }}
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="['type', 'date', 'value']"></tr>
        <tr
          mat-row
          *matRowDef="let row; columns: ['type', 'date', 'value']"
        ></tr>
      </table>
    </mat-card>

    <div class="summary-cards">
      <app-summary-product-card
        title="Aplicações em andamento"
        value="3 Investimentos"
        icon="trending_up"
      ></app-summary-product-card>

      <app-summary-product-card
        title="Coberturas em vigor"
        value="2 Seguros"
        icon="shield"
      ></app-summary-product-card>
    </div>
  </div>
</section>
