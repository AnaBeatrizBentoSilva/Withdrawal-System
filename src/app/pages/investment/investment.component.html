<section class="investment-container">
  <h2>Investimentos</h2>
  <mat-card class="balance-card">
    <h4>Total Investido</h4>
    <p class="balance">{{ totalInvested | currency: 'BRL': 'symbol' }}</p>

    <div class="buttons">
      <button mat-stroked-button (click)="openModal('Renda fixa')">
        <mat-icon>savings</mat-icon> Renda fixa
      </button>
      <button mat-stroked-button (click)="openModal('Fundos de investimento')">
        <mat-icon>trending_up</mat-icon> Fundos de investimento
      </button>
      <button mat-stroked-button (click)="openModal('Previdência privada')">
        <mat-icon>account_balance</mat-icon> Previdência privada
      </button>
    </div>
  </mat-card>

  <div class="recent">
    <h4>Investimentos recentes</h4>
    <table mat-table [dataSource]="recentInvestments" class="mat-elevation-z1">

      <ng-container matColumnDef="type">
        <th mat-header-cell *matHeaderCellDef> Aplicação </th>
        <td mat-cell *matCellDef="let element"> {{element.type}} </td>
      </ng-container>

      <ng-container matColumnDef="date">
        <th mat-header-cell *matHeaderCellDef> Data </th>
        <td mat-cell *matCellDef="let element"> {{element.date | date: 'dd/MM/yyyy'}} </td>
      </ng-container>

      <ng-container matColumnDef="value">
        <th mat-header-cell *matHeaderCellDef> Valor </th>
        <td mat-cell *matCellDef="let element" class="negative"> {{element.value | currency: 'BRL': 'symbol'}} </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="['type', 'date', 'value']"></tr>
      <tr mat-row *matRowDef="let row; columns: ['type', 'date', 'value'];"></tr>
    </table>
  </div>

</section>
